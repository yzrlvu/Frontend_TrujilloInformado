<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trujillo Informado</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{
  --bg:#f7f7f5; --card:#fff; --ink:#1a1a1a; --muted:#6b6b6b; --line:#e8e8e4;
  --accent:#1f7a4d; --accent-soft:#e7f3ec;
  --warn:#b7791f; --warn-soft:#fbf3e4; --info:#2b6cb0; --info-soft:#e8f0fa;
  --r:12px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
.hidden{display:none!important}

/* layout */
.app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:4px;background:var(--card)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;margin:0 8px 24px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--accent)}
.nav{padding:9px 12px;border-radius:8px;cursor:pointer;color:var(--muted);border:0;background:none;text-align:left}
.nav:hover{background:var(--bg);color:var(--ink)}
.nav.active{background:var(--accent-soft);color:var(--accent);font-weight:500}
.user{margin-top:auto;padding:12px;border-top:1px solid var(--line);font-size:13px}
.user small{color:var(--muted);display:block}
main{padding:32px 40px;max-width:1100px;width:100%}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--muted);margin-top:2px}
.head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:24px;gap:16px;flex-wrap:wrap}

/* elements */
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:8px;cursor:pointer;transition:.15s}
.btn:hover{border-color:#cfcfca}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:24px}
.kpi{padding:16px 18px}
.kpi span{color:var(--muted);font-size:12px}
.kpi b{display:block;font-size:26px;font-weight:600;margin-top:4px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chip{border:1px solid var(--line);background:var(--card);padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--muted)}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;background:var(--card);outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 5px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}

/* list */
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:1fr auto;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line);cursor:pointer;align-items:center}
.item:last-child{border-bottom:0}
.item:hover{background:#fbfbfa}
.item h3{font-size:14px;font-weight:500}
.meta{color:var(--muted);font-size:12px;display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.badge{font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap;font-weight:500}
.s-PENDIENTE{background:var(--warn-soft);color:var(--warn)}
.s-EN_PROGRESO{background:var(--info-soft);color:var(--info)}
.s-RESUELTO{background:var(--accent-soft);color:var(--accent)}
.empty{padding:48px;text-align:center;color:var(--muted)}
.bar{height:6px;background:var(--bg);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent)}
.types{padding:18px 20px;display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:2fr 1fr;gap:16px}

/* drawer & modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.25);display:flex;justify-content:flex-end;z-index:10}
.drawer{width:440px;max-width:100%;background:var(--card);height:100%;padding:28px;overflow:auto;animation:in .2s ease}
.overlay.center{justify-content:center;align-items:center}
.modal{width:480px;max-width:94%;background:var(--card);border-radius:16px;padding:28px;animation:up .2s ease}
@keyframes in{from{transform:translateX(30px);opacity:0}}
@keyframes up{from{transform:translateY(10px);opacity:0}}
.dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:18px 0;font-size:13px}
.dl dt{color:var(--muted)}
.photos{display:flex;gap:8px;flex-wrap:wrap}
.photos img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.stars button{border:0;background:none;font-size:22px;cursor:pointer;color:#d6d6d0}
.stars button.on{color:#e0a100}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login .card{width:380px;max-width:100%;padding:36px}
.login h1{margin:18px 0 4px}
.demo{display:flex;gap:6px;margin-top:8px}
.demo .btn{flex:1;font-size:12px;padding:7px}
.sep{text-align:center;color:var(--muted);font-size:12px;margin:20px 0 4px}
#map{height:240px;border-radius:8px;border:1px solid var(--line);margin-top:8px;z-index:0}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:20}
.link{color:var(--accent);cursor:pointer;background:none;border:0;font-size:13px}

@media(max-width:800px){
  .app{grid-template-columns:1fr}
  aside{flex-direction:row;overflow:auto;padding:12px;border-right:0;border-bottom:1px solid var(--line)}
  .brand{margin:0 12px 0 0}.user{display:none}
  main{padding:20px}.kpis{grid-template-columns:1fr 1fr}.grid2,.row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<!-- LOGIN -->
<section id="loginView" class="login">
  <div class="card">
    <div class="brand" style="margin:0"><span class="dot"></span>Trujillo Informado</div>
    <h1 id="authTitle">Inicia sesión</h1>
    <p class="sub" id="authSub">Reporta y sigue incidencias ambientales de tu ciudad.</p>
    <form id="authForm">
      <div id="regFields" class="hidden">
        <div class="row">
          <div><label>Nombre</label><input name="firstname"></div>
          <div><label>Apellido</label><input name="lastname"></div>
        </div>
        <div class="row">
          <div><label>Teléfono</label><input name="phone"></div>
          <div><label>Nacimiento</label><input name="birthdate" type="date"></div>
        </div>
      </div>
      <label>Correo</label><input name="email" type="email" required>
      <label>Contraseña</label><input name="password" type="password" required>
      <button class="btn primary" style="width:100%;margin-top:20px" id="authBtn">Ingresar</button>
    </form>
    <p style="text-align:center;margin-top:14px"><button class="link" id="toggleAuth">¿No tienes cuenta? Regístrate</button></p>
    <p class="sep">o explora en modo demo</p>
    <div class="demo">
      <button class="btn" data-demo="CIUDADANO">Ciudadano</button>
      <button class="btn" data-demo="SUPERVISOR">Supervisor</button>
      <button class="btn" data-demo="TRABAJADOR">Trabajador</button>
    </div>
    <details style="margin-top:18px;font-size:12px;color:var(--muted)">
      <summary style="cursor:pointer">Servidor API</summary>
      <input id="apiBase" style="margin-top:8px" placeholder="http://localhost:8080">
    </details>
  </div>
</section>

<!-- APP -->
<div id="appView" class="app hidden">
  <aside>
    <div class="brand"><span class="dot"></span>Trujillo Informado</div>
    <div id="nav"></div>
    <div class="user"><b id="uName"></b><small id="uRole"></small>
      <button class="link" id="logout" style="margin-top:6px;padding:0">Cerrar sesión</button></div>
  </aside>
  <main id="main"></main>
</div>

<div id="layer"></div>

<script>
/* ---------- constantes del backend ---------- */
const TYPES={RESIDUOS_SOLIDOS:"Residuos sólidos",MALEZA:"Maleza",BARRIDO:"Barrido"};
const STATUS={PENDIENTE:"Pendiente",EN_PROGRESO:"En progreso",RESUELTO:"Resuelto"};
const PRIORITY={BAJA:"Baja",MEDIA:"Media",ALTA:"Alta"};

const jwt=t=>{try{return JSON.parse(decodeURIComponent(escape(atob(t.split('.')[1].replace(/-/g,'+').replace(/_/g,'/')))))}catch{return{}}};
const S={token:null,role:null,demo:false,name:"",view:null,filters:{estados:[],tipos:[]}};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=d=>d?new Date(d).toLocaleDateString("es-PE",{day:"2-digit",month:"short"}):"—";
const toast=m=>{const t=document.createElement("div");t.className="toast";t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2400)};
const badge=s=>`<span class="badge s-${s}">${STATUS[s]||s}</span>`;

/* ---------- datos demo ---------- */
const now=Date.now(),day=864e5;
const DEMO={
  reportes:[
    {id:101,type:"RESIDUOS_SOLIDOS",description:"Acumulación de basura en la esquina del parque",location:{lat:-8.11,lng:-79.03,address:"Av. España 1234"},zone:"Centro Histórico",status:"PENDIENTE",priority:"ALTA",citizenName:"Lucía Ramos",createdAt:now-day},
    {id:102,type:"MALEZA",description:"Maleza crecida bloquea la vereda",location:{address:"Calle Los Pinos 456"},zone:"El Recreo",status:"EN_PROGRESO",priority:"MEDIA",citizenName:"Jorge Díaz",assignedTo:"Carlos Vega",createdAt:now-3*day},
    {id:103,type:"BARRIDO",description:"Arena y hojas en la ciclovía",location:{address:"Av. Larco 890"},zone:"Buenos Aires",status:"RESUELTO",priority:"BAJA",citizenName:"Ana Torres",rating:5,createdAt:now-6*day,completedAt:now-4*day},
    {id:104,type:"RESIDUOS_SOLIDOS",description:"Desmonte abandonado frente al colegio",location:{address:"Jr. Pizarro 210"},zone:"Centro Histórico",status:"PENDIENTE",priority:"MEDIA",citizenName:"Lucía Ramos",createdAt:now-2*day},
    {id:105,type:"MALEZA",description:"Berma central sin mantenimiento",location:{address:"Av. América Sur"},zone:"La Noria",status:"RESUELTO",priority:"BAJA",citizenName:"Pedro Ruiz",createdAt:now-9*day,completedAt:now-7*day},
  ],
  trabajadores:[{id:1,name:"Carlos",lastname:"Vega"},{id:2,name:"María",lastname:"Quispe"},{id:3,name:"Luis",lastname:"Castro"}],
  tareas:[
    {id:501,reportId:102,type:"MALEZA",description:"Cortar maleza y limpiar vereda",location:{address:"Calle Los Pinos 456"},status:"EN_PROGRESO",assignedAt:now-2*day},
    {id:502,reportId:104,type:"RESIDUOS_SOLIDOS",description:"Retirar desmonte con camión",location:{address:"Jr. Pizarro 210"},status:"PENDIENTE",assignedAt:now-day},
    {id:503,reportId:103,type:"BARRIDO",description:"Barrido de ciclovía",location:{address:"Av. Larco 890"},status:"RESUELTO",assignedAt:now-5*day,completedAt:now-4*day},
  ]
};

/* ---------- API (endpoints reales del backend) ---------- */
const base=()=>(localStorage.getItem("ti_api")||"http://localhost:8080").replace(/\/$/,"");
async function api(path,opt={}){
  const r=await fetch(base()+path,{...opt,headers:{"Content-Type":"application/json",...(S.token?{Authorization:"Bearer "+S.token}:{}),...opt.headers}});
  if(!r.ok){const t=await r.text();let m=t;try{m=JSON.parse(t).message||t}catch{}throw new Error(m||("Error "+r.status))}
  const ct=r.headers.get("content-type")||"";
  return ct.includes("json")?r.json():r.text();
}
const qs=o=>{const p=new URLSearchParams();Object.entries(o).forEach(([k,v])=>[].concat(v).filter(x=>x!==""&&x!=null).forEach(x=>p.append(k,x)));const s=p.toString();return s?"?"+s:""};
const content=r=>Array.isArray(r)?r:(r?.content||[]);

const data={
  async misReportes(estado){ if(S.demo) return DEMO.reportes.filter(r=>r.citizenName==="Lucía Ramos"&&(!estado||r.status===estado)); return content(await api("/api/v1/reportes/me"+qs({estado,size:50,sort:"createdAt,desc"}))); },
  async zona(){ const f=S.filters; if(S.demo) return DEMO.reportes.filter(r=>(!f.estados.length||f.estados.includes(r.status))&&(!f.tipos.length||f.tipos.includes(r.type))); return content(await api("/api/v1/reportes/supervisor/me"+qs({...f,size:50,sort:"createdAt,desc"}))); },
  async resumen(){ if(S.demo){const r=DEMO.reportes,byType={};r.forEach(x=>byType[x.type]=(byType[x.type]||0)+1);return{total:r.length,pending:r.filter(x=>x.status==="PENDIENTE").length,resolved:r.filter(x=>x.status==="RESUELTO").length,byType};} return api("/api/v1/reportes/supervisor/summary"+qs(S.filters)); },
  async trabajadores(){ return S.demo?DEMO.trabajadores:api("/api/v1/trabajadores"); },
  async misTareas(estado){ if(S.demo) return DEMO.tareas.filter(t=>!estado||t.status===estado); return content(await api("/api/v1/tareas/me"+qs({estado,size:50}))); },
  async crearReporte(dto){ if(S.demo){DEMO.reportes.unshift({...dto,id:Date.now()%1000,status:"PENDIENTE",citizenName:"Lucía Ramos",zone:"Centro Histórico",createdAt:Date.now()});return;} return api("/api/v1/reporte",{method:"POST",body:JSON.stringify({...dto,citizenId:String(S.uid??jwt(S.token).id)})}); },
  async asignar(rep,workerId,description){ if(S.demo){rep.status="EN_PROGRESO";const w=DEMO.trabajadores.find(x=>x.id==workerId);rep.assignedTo=w.name+" "+w.lastname;return;} return api("/api/v1/tarea",{method:"POST",body:JSON.stringify({reportId:rep.id,workerId:+workerId,description,type:rep.type,location:rep.location})}); },
  async completar(t,evidence){ if(S.demo){t.status="RESUELTO";t.completedAt=Date.now();return;} return api(`/api/v1/tarea/${t.id}/completar`,{method:"PATCH",body:JSON.stringify({notes:"",evidences:[].concat(evidence)})}); },
  async calificar(r,rating,comment){ if(S.demo){r.rating=rating;return;} return api(`/api/v1/reporte/${r.id}/rate`,{method:"PATCH",body:JSON.stringify({rating,comment})}); },
  async subir(file,kind){ if(S.demo) return URL.createObjectURL(file); const fd=new FormData();fd.append("file",file); const r=await fetch(base()+`/api/v1/${kind}/cargar`,{method:"POST",headers:{Authorization:"Bearer "+S.token},body:fd}); if(!r.ok)throw new Error("Error al subir"); return r.text(); },
};

/* ---------- auth ---------- */
let registering=false;
$("#apiBase").value=localStorage.getItem("ti_api")||"";
$("#apiBase").onchange=e=>localStorage.setItem("ti_api",e.target.value);
$("#toggleAuth").onclick=()=>{registering=!registering;$("#regFields").classList.toggle("hidden",!registering);
  $("#authTitle").textContent=registering?"Crea tu cuenta":"Inicia sesión";$("#authBtn").textContent=registering?"Registrarme":"Ingresar";
  $("#toggleAuth").textContent=registering?"¿Ya tienes cuenta? Inicia sesión":"¿No tienes cuenta? Regístrate";};
$("#authForm").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  try{if(registering)await api("/api/v1/auth/registro",{method:"POST",body:JSON.stringify(f)});
    const r=await api("/api/v1/auth/autenticar",{method:"POST",body:JSON.stringify({email:f.email,password:f.password})});
    const c=jwt(r.accessToken);enter({token:r.accessToken,role:r.role||"CIUDADANO",name:c.name||f.firstname||f.email.split("@")[0],uid:c.id});
  }catch(err){toast("No se pudo conectar: revisa credenciales o el servidor API")}};
document.querySelectorAll("[data-demo]").forEach(b=>b.onclick=()=>enter({demo:true,role:b.dataset.demo,name:{CIUDADANO:"Lucía Ramos",SUPERVISOR:"Rosa Medina",TRABAJADOR:"Carlos Vega"}[b.dataset.demo]}));
$("#logout").onclick=()=>{sessionStorage.removeItem("ti_s");location.reload()};

const NAV={
  CIUDADANO:[["mis","Mis reportes"],["nuevo","Nuevo reporte"]],
  SUPERVISOR:[["panel","Panel"],["reportes","Reportes de zona"]],
  TRABAJADOR:[["tareas","Mis tareas"]],
};
function enter(o){Object.assign(S,o);S.role=String(S.role).replace("ROLE_","").toUpperCase();
  if(!NAV[S.role])S.role="CIUDADANO";
  sessionStorage.setItem("ti_s",JSON.stringify({token:S.token,role:S.role,demo:S.demo,name:S.name,uid:S.uid}));
  $("#loginView").classList.add("hidden");$("#appView").classList.remove("hidden");
  $("#uName").textContent=S.name;$("#uRole").textContent=S.role.charAt(0)+S.role.slice(1).toLowerCase()+(S.demo?" · demo":"");
  $("#nav").innerHTML=NAV[S.role].map(([k,l])=>`<button class="nav" data-v="${k}">${l}</button>`).join("");
  document.querySelectorAll(".nav").forEach(b=>b.onclick=()=>go(b.dataset.v));
  go(NAV[S.role][0][0]);
}
function go(v){S.view=v;document.querySelectorAll(".nav").forEach(b=>b.classList.toggle("active",b.dataset.v===v));VIEWS[v]()}

/* ---------- componentes ---------- */
const listHTML=(items,render)=>items.length?`<div class="card list">${items.map(render).join("")}</div>`:`<div class="card empty">No hay nada por aquí todavía.</div>`;
const reportItem=(r,i)=>`<div class="item" data-i="${i}"><div><h3>${esc(r.description)}</h3>
  <div class="meta"><span>${TYPES[r.type]||r.type}</span><span>${esc(r.location?.address||"")}</span><span>${fmt(r.createdAt)}</span>${r.zone?`<span>${esc(r.zone)}</span>`:""}</div></div>${badge(r.status)}</div>`;
function chips(group,dict,sel,onChange){return `<div class="filters" data-g="${group}">${Object.entries(dict).map(([k,l])=>`<button class="chip ${sel.includes(k)?"on":""}" data-k="${k}">${l}</button>`).join("")}</div>`}
function bindChips(cb){document.querySelectorAll(".filters .chip").forEach(c=>c.onclick=()=>{c.classList.toggle("on");cb()})}
const picked=g=>[...document.querySelectorAll(`.filters[data-g="${g}"] .chip.on`)].map(c=>c.dataset.k);
function openLayer(html,center){$("#layer").innerHTML=`<div class="overlay ${center?"center":""}"><div class="${center?"modal":"drawer"}">${html}</div></div>`;
  $("#layer .overlay").onclick=e=>{if(e.target.classList.contains("overlay"))closeLayer()}}
const closeLayer=()=>$("#layer").innerHTML="";
const loading=()=>$("#main").innerHTML=`<div class="empty">Cargando…</div>`;
const fail=e=>{$("#main").innerHTML=`<div class="card empty">No se pudo cargar la información.<br><small>${esc(e.message)}</small></div>`};

function detail(r,extra=""){return `<div style="display:flex;justify-content:space-between;align-items:center">${badge(r.status)}<button class="btn ghost" onclick="closeLayer()">✕</button></div>
  <h1 style="margin-top:16px;font-size:19px">${esc(r.description)}</h1>
  <dl class="dl"><dt>Tipo</dt><dd>${TYPES[r.type]||r.type}</dd><dt>Dirección</dt><dd>${esc(r.location?.address||"—")}</dd>
  ${r.zone?`<dt>Zona</dt><dd>${esc(r.zone)}</dd>`:""}${r.priority?`<dt>Prioridad</dt><dd>${PRIORITY[r.priority]}</dd>`:""}
  ${r.citizenName?`<dt>Ciudadano</dt><dd>${esc(r.citizenName)}</dd>`:""}${r.assignedTo?`<dt>Asignado a</dt><dd>${esc(r.assignedTo)}</dd>`:""}
  <dt>Creado</dt><dd>${fmt(r.createdAt||r.assignedAt)}</dd>${r.completedAt?`<dt>Resuelto</dt><dd>${fmt(r.completedAt)}</dd>`:""}</dl>
  ${r.photos?.length?`<label>Fotos</label><div class="photos">${r.photos.map(p=>`<img src="${esc(p)}">`).join("")}</div>`:""}
  ${r.evidence?.length?`<label>Evidencia</label><div class="photos">${[].concat(r.evidence).map(p=>`<img src="${esc(p)}">`).join("")}</div>`:""}${extra}`}

/* ---------- vistas ---------- */
const VIEWS={
  /* CIUDADANO */
  async mis(estado=""){loading();try{const items=await data.misReportes(estado);
    $("#main").innerHTML=`<div class="head"><div><h1>Mis reportes</h1><p class="sub">Sigue el estado de lo que reportaste.</p></div><button class="btn primary" onclick="go('nuevo')">+ Nuevo reporte</button></div>
    <div class="filters">${[["","Todos"],...Object.entries(STATUS)].map(([k,l])=>`<button class="chip ${k===estado?"on":""}" data-s="${k}">${l}</button>`).join("")}</div>${listHTML(items,reportItem)}`;
    document.querySelectorAll("[data-s]").forEach(c=>c.onclick=()=>VIEWS.mis(c.dataset.s));
    document.querySelectorAll(".item").forEach(el=>el.onclick=()=>{const r=items[el.dataset.i];
      const rate=r.status==="RESUELTO"?`<label>${r.rating?"Tu calificación":"¿Cómo fue la atención?"}</label><div class="stars">${[1,2,3,4,5].map(n=>`<button data-n="${n}" class="${n<=(r.rating||0)?"on":""}">★</button>`).join("")}</div>`:"";
      openLayer(detail(r,rate));
      document.querySelectorAll(".stars button").forEach(b=>b.onclick=async()=>{try{await data.calificar(r,+b.dataset.n);toast("¡Gracias por tu calificación!");closeLayer();VIEWS.mis(estado)}catch{toast("No se pudo calificar")}});
    });
  }catch(e){fail(e)}},

  nuevo(){let photos=[],loc={};
    $("#main").innerHTML=`<div class="head"><div><h1>Nuevo reporte</h1><p class="sub">Cuéntanos qué viste y dónde. Toma menos de un minuto.</p></div></div>
    <form class="card" id="rf" style="padding:24px;max-width:560px">
      <label>¿Qué tipo de problema es?</label>
      <div class="filters" id="tp">${Object.entries(TYPES).map(([k,l],i)=>`<button type="button" class="chip ${i?"":"on"}" data-k="${k}">${l}</button>`).join("")}</div>
      <label>Descripción</label><textarea name="description" rows="3" required placeholder="Ej. Basura acumulada junto al paradero"></textarea>
      <label>Dirección o referencia</label>
      <div style="display:flex;gap:8px"><input name="address" id="addr" required placeholder="Av. España 1234"><button type="button" class="btn" id="geo" title="Usar mi ubicación">📍</button></div>
      <div id="map"></div><p class="hint" id="lh">Toca el mapa para marcar el lugar exacto, o usa 📍.</p>
      <label>Fotos (opcional)</label><input type="file" accept="image/*" multiple id="ph"><div class="photos" id="pv" style="margin-top:8px"></div>
      <div class="actions"><button type="button" class="btn ghost" onclick="go('mis')">Cancelar</button><button class="btn primary">Enviar reporte</button></div>
    </form>`;
    document.querySelectorAll("#tp .chip").forEach(c=>c.onclick=()=>{document.querySelectorAll("#tp .chip").forEach(x=>x.classList.remove("on"));c.classList.add("on")});
    const map=L.map("map").setView([-8.1116,-79.0288],14);let mk;
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(map);
    const setLoc=async(lat,lng,center)=>{loc={lat,lng};mk?mk.setLatLng([lat,lng]):mk=L.marker([lat,lng]).addTo(map);if(center)map.setView([lat,lng],17);
      $("#lh").textContent=`Ubicación: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
      try{const g=await (await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&accept-language=es`)).json();
        const a=g.address||{};$("#addr").value=[a.road,a.house_number].filter(Boolean).join(" ")||(g.display_name||"").split(",").slice(0,2).join(",")}catch{}};
    map.on("click",e=>setLoc(e.latlng.lat,e.latlng.lng));
    setTimeout(()=>map.invalidateSize(),50);
    $("#geo").onclick=()=>{if(!navigator.geolocation)return toast("Tu navegador no soporta ubicación");toast("Obteniendo ubicación…");
      navigator.geolocation.getCurrentPosition(p=>setLoc(p.coords.latitude,p.coords.longitude,true),()=>toast("No se pudo obtener la ubicación; márcala en el mapa"),{enableHighAccuracy:true,timeout:10000})};
    $("#ph").onchange=async e=>{for(const f of e.target.files){try{const url=await data.subir(f,"reporte");photos.push(url);$("#pv").insertAdjacentHTML("beforeend",`<img src="${esc(url)}">`)}catch{toast("No se pudo subir la foto (revisa Cloudinary)")}}};
    $("#rf").onsubmit=async e=>{e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
      if(loc.lat==null)return toast("Marca la ubicación en el mapa");
      try{await data.crearReporte({type:$("#tp .chip.on").dataset.k,description:f.description,location:{...loc,address:f.address},photos});toast("Reporte enviado");go("mis")}catch(err){toast(/zona/i.test(err.message)?"Esa ubicación está fuera de las zonas de SEGAT":"No se pudo enviar: "+err.message.slice(0,90))}};
  },

  /* SUPERVISOR */
  async panel(){loading();try{const [k,items]=await Promise.all([data.resumen(),data.zona()]);
    const max=Math.max(1,...Object.values(k.byType||{}));const prog=k.total-k.pending-k.resolved;
    $("#main").innerHTML=`<div class="head"><div><h1>Panel</h1><p class="sub">Resumen de tu zona.</p></div><button class="btn" id="pdf">Exportar PDF</button></div>
    <div class="kpis">${[["Total",k.total],["Pendientes",k.pending],["En progreso",prog],["Resueltos",k.resolved]].map(([l,v])=>`<div class="card kpi"><span>${l}</span><b>${v}</b></div>`).join("")}</div>
    <div class="grid2"><div><h3 style="font-size:14px;font-weight:500;margin-bottom:10px">Pendientes recientes</h3>${listHTML(items.filter(r=>r.status==="PENDIENTE").slice(0,5),reportItem)}</div>
    <div><h3 style="font-size:14px;font-weight:500;margin-bottom:10px">Por tipo</h3><div class="card types">${Object.entries(k.byType||{}).map(([t,n])=>`<div><div style="display:flex;justify-content:space-between"><span>${TYPES[t]||t}</span><b>${n}</b></div><div class="bar"><i style="width:${n/max*100}%"></i></div></div>`).join("")||"<span class='sub'>Sin datos</span>"}</div></div></div>`;
    const pend=items.filter(r=>r.status==="PENDIENTE").slice(0,5);
    document.querySelectorAll(".item").forEach(el=>el.onclick=()=>supDetail(pend[el.dataset.i]));
    $("#pdf").onclick=exportPdf;
  }catch(e){fail(e)}},

  async reportes(){loading();try{const items=await data.zona();
    $("#main").innerHTML=`<div class="head"><div><h1>Reportes de zona</h1><p class="sub">${items.length} reportes · filtra y asigna.</p></div><button class="btn" id="pdf">Exportar PDF</button></div>
    ${chips("estados",STATUS,S.filters.estados)}${chips("tipos",TYPES,S.filters.tipos)}${listHTML(items,reportItem)}`;
    bindChips(()=>{S.filters={estados:picked("estados"),tipos:picked("tipos")};VIEWS.reportes()});
    document.querySelectorAll(".item").forEach(el=>el.onclick=()=>supDetail(items[el.dataset.i]));
    $("#pdf").onclick=exportPdf;
  }catch(e){fail(e)}},

  /* TRABAJADOR */
  async tareas(estado=""){loading();try{const items=await data.misTareas(estado);
    $("#main").innerHTML=`<div class="head"><div><h1>Mis tareas</h1><p class="sub">${items.filter(t=>t.status!=="RESUELTO").length} por atender.</p></div></div>
    <div class="filters">${[["","Todas"],...Object.entries(STATUS)].map(([k,l])=>`<button class="chip ${k===estado?"on":""}" data-s="${k}">${l}</button>`).join("")}</div>
    ${listHTML(items,(t,i)=>`<div class="item" data-i="${i}"><div><h3>${esc(t.description||t.report?.description)}</h3><div class="meta"><span>${TYPES[t.type]||t.type}</span><span>${esc(t.location?.address||"")}</span><span>Asignada ${fmt(t.assignedAt)}</span></div></div>${badge(t.status)}</div>`)}`;
    document.querySelectorAll("[data-s]").forEach(c=>c.onclick=()=>VIEWS.tareas(c.dataset.s));
    document.querySelectorAll(".item").forEach(el=>el.onclick=()=>{const t=items[el.dataset.i];let ev=[];
      const done=t.status==="RESUELTO";
      openLayer(detail({...t,description:t.description||t.report?.description},done?"":`<label>Evidencia del trabajo</label><input type="file" accept="image/*" id="evf"><div class="photos" id="evp" style="margin-top:8px"></div>
        <div class="actions"><button class="btn primary" id="cmp">Marcar como completada</button></div>`));
      if(done)return;
      $("#evf").onchange=async e=>{try{const u=await data.subir(e.target.files[0],"tarea");ev=[u];$("#evp").innerHTML=`<img src="${esc(u)}">`}catch{toast("Error al subir")}};
      $("#cmp").onclick=async()=>{if(!ev.length)return toast("Adjunta una foto de evidencia");try{await data.completar(t,ev[0]);toast("Tarea completada");closeLayer();VIEWS.tareas(estado)}catch{toast("No se pudo completar")}};
    });
  }catch(e){fail(e)}},
};

async function supDetail(r){
  let ws=[];try{ws=await data.trabajadores()}catch{}
  const assign=r.status==="PENDIENTE"?`<div class="card" style="padding:16px;margin-top:8px;background:var(--bg)"><b style="font-weight:500">Asignar tarea</b>
    <label>Trabajador</label><select id="w">${ws.map(w=>`<option value="${w.id}">${esc(w.name)} ${esc(w.lastname)}</option>`).join("")}</select>
    <label>Instrucciones</label><textarea id="ins" rows="2" placeholder="Qué debe hacer el trabajador"></textarea>
    <div class="actions"><button class="btn primary" id="asg">Asignar</button></div></div>`:"";
  openLayer(detail(r,assign));
  if($("#asg"))$("#asg").onclick=async()=>{try{await data.asignar(r,$("#w").value,$("#ins").value||r.description);toast("Tarea asignada");closeLayer();VIEWS[S.view]()}catch{toast("No se pudo asignar")}};
}

async function exportPdf(){
  if(S.demo)return toast("La exportación PDF requiere el servidor real");
  try{const r=await fetch(base()+"/api/v1/reportes/supervisor/export/pdf"+qs(S.filters),{headers:{Authorization:"Bearer "+S.token}});
    const b=await r.blob();const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="reportes.pdf";a.click();
  }catch{toast("No se pudo exportar")}
}

/* sesión guardada */
try{const s=JSON.parse(sessionStorage.getItem("ti_s"));if(s&&(s.token||s.demo))enter(s)}catch{}
</script>
</body>
</html>
